[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuro-dashboard"
# Version PyPI (PEP 440), lue depuis le paquet. Tag git : v1.3.0-kuro (R19).
dynamic = ["version"]
description = "Xenon (ex kuro-glances) : Glances Kuro, live system monitor + project dashboard (localhost API + web UI)"
readme = "packaging/README.pypi.md"
license = "MIT"
authors = [{ name = "lambda-Section" }]
requires-python = ">=3.10"
dependencies = []
optional-dependencies = { full = ["psutil"], textual = ["textual>=8"] }
keywords = ["monitoring", "dashboard", "system", "kuro"]

[project.urls]
Homepage = "https://github.com/Lemniscate-world/kuro-rules"
Repository = "https://github.com/Lemniscate-world/kuro-rules"

[project.scripts]
kuro-dashboard = "kuro_dashboard.api:main"
kuro-system = "kuro_dashboard.system:main"
xenon = "kuro_dashboard.tui:main"
xenon-tui = "kuro_dashboard.tui_textual:main"
# Alias dépréciés (décision 2026-10-04 : kuro-glances -> Xenon).
kuro-glances = "kuro_dashboard.tui:main"
kuro-glances-tui = "kuro_dashboard.tui_textual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "kuro_dashboard.__version__" }

[tool.setuptools.package-data]
kuro_dashboard = ["static/*", "*.tcss"]

# Qualité (CI quality.yml + pre-commit) : ruff remplace flake8/isort/black,
# mypy permissif ciblé (stubs psutil absents, termios/fcntl Unix-only),
# coverage ciblée tui.py (96 % réel), bandit Medium+ (B110/B112 = design
# "jamais d'exception" volontaire du TUI, faux positifs B608/B310 en nosec).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["S101", "E402"]
"scripts/*.py" = ["E402", "UP031"]
# UP031 (printf -> f-string) reste à migrer dans scripts/ : 58 sites sûrs
# mais trop diffus pour cette PR — suivi dédié, CI src+tests déjà stricte.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = "kuro_dashboard.tui"
ignore_errors = false
disable_error_code = ["attr-defined", "union-attr"]

[tool.coverage.run]
source = ["src/kuro_dashboard"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ =="]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
skips = ["B110", "B112"]
