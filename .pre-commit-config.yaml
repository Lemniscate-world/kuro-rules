exclude: "^(node_modules|gui/node_modules|gui/dist)/"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: ["src/kuro_dashboard"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-ll", "-q"]
        additional_dependencies: ["bandit[toml]"]

- repo: local
  hooks:
    - id: kuro-rules-audit
      name: kuro-rules audit
      entry: python audit-rules.py --mode repo --scope all
      language: system
      pass_filenames: false
      stages: [pre-commit]
