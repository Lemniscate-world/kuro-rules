name: Truth Daily — Audit factuel + Portfolio

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC = 06:00 Paris, quotidien
  workflow_dispatch:

permissions:
  contents: write

jobs:
  truth-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kuro-rules
        uses: actions/checkout@v4
        with:
          path: kuro-rules

      - name: Checkout Lemniscate-world
        uses: actions/checkout@v4
        with:
          repository: Lemniscate-world/Lemniscate-world
          path: lemniscate-world
          token: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Daily truth audit (git log + tests)
        run: |
          python kuro-rules/scripts/audit_truth_daily.py --dry-run --output kuro-rules/TRUTH_DAILY.md
          cat kuro-rules/TRUTH_DAILY.md | head -n 30

      - name: Compute realistic % (factuel)
        run: |
          python kuro-rules/scripts/compute_progress.py --apply || true
          echo "Epingle diff:"
          git -C kuro-rules diff --stat || true

      - name: Generate portfolio (truth-enriched + mondes)
        run: |
          python kuro-rules/scripts/generate_portfolio.py \
            --epingle kuro-rules/Epingle_Projets.md \
            --output lemniscate-world/index.html
          ls -la lemniscate-world/sections/ | head -n 20
          ls -la lemniscate-world/sections/s-1/ || true

      - name: Generate blog (factuel)
        run: |
          python kuro-rules/scripts/generate_blog.py --apply
          ls -la lemniscate-world/blog/ | head -n 20

      - name: Commit TRUTH_DAILY + Epingle + portfolio if changed
        run: |
          cd kuro-rules
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TRUTH_DAILY.md Epingle_Projets.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: truth daily audit + realistic % $(date +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "No truth changes"
          fi
          cd ../lemniscate-world
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sections/ blog/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync portfolio + mondes + blog truth $(date +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "No portfolio changes"
          fi
