name: Quality

# Pipeline qualité : lint + types + tests ciblés + sécurité.
# Sources : GitHub Docs "Building and testing Python" (ruff + pytest-cov),
# guide PYTHON-BEST-PRACTICES-2025 (ruff/mypy/pytest/bandit/pre-commit).
# Design : rapide (<10 min), déterministe, least-privilege, annulation auto.
on:
  push:
    branches: [main, master, develop, 'feat/*', 'fix/*', 'infra/*', 'sec/*', 'docs/*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install ruff
        run: python -m pip install -q "ruff>=0.14"
      - name: Lint (bloquant, config pyproject.toml)
        run: python -m ruff check --output-format=github src/ tests/

  type:
    name: Mypy (types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install mypy
        run: python -m pip install -q "mypy>=1.18" types-requests
      - name: Type-check dashboard (bloquant, config pyproject.toml)
        run: python -m mypy src/kuro_dashboard

  test:
    name: Pytest TUI (matrice OS, R93)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install test deps
        run: python -m pip install -q pytest pytest-cov psutil
      - name: TUI Xenon (bloquant)
        run: python -m pytest tests/test_kuro_tui_parts.py tests/test_kuro_tui.py tests/test_kuro_tui_fresh.py -q
      - name: Porte couverture tui.py >= 90 % (bloquant, anti-régression R116)
        run: python -m pytest tests/test_kuro_tui_parts.py -q --cov=kuro_dashboard.tui --cov-report=term-missing --cov-fail-under=90

  security:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install security tools
        run: python -m pip install -q "bandit[toml]>=1.7" pip-audit
      - name: "Bandit Medium+ (bloquant, Low exclus : B110/B112 = design TUI)"
        run: python -m bandit -r src/kuro_dashboard -ll -q
      - name: pip-audit (informatif, continue-on-error)
        run: python -m pip_audit
        continue-on-error: true
