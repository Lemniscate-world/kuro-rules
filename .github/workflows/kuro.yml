name: Kuro

on:
  schedule:
    - cron: "0 5 * * *"    # cycle complet quotidien (vérité + publication)
    - cron: "*/30 * * * *" # sentinelle rapide 24/7 (scan CI seul)
  push:
    paths:
      - 'Epingle_Projets.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  KURO_RULES_DIR: ${{ github.workspace }}/kuro-rules
  LEMNISCATE_DIR: ${{ github.workspace }}/lemniscate-world
  DOCS_DIR: /home/runner/Documents
  KURO_FULL: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *' }}

jobs:
  kuro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kuro-rules
        uses: actions/checkout@v4
        with:
          path: kuro-rules

      - name: Checkout Lemniscate-world
        uses: actions/checkout@v4
        with:
          repository: Lemniscate-world/Lemniscate-world
          path: lemniscate-world
          token: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests (pytest)
        run: |
          python -m pip install pytest -q
          python -m pytest kuro-rules/tests -q

      - name: Clone repos into ~/Documents (source de vérité)
        if: env.KURO_FULL == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
        run: |
          python kuro-rules/scripts/clone_repos_for_truth.py --token "$SYNC_TOKEN"
          ls ~/Documents | wc -l

      # --- Sentinelle CI (santé des repos) ---
      - name: Scan CI multi-repos + bloc README
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'ox-alpha:free' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KURO_AUTO_FIX: '1'
        run: |
          python kuro-rules/scripts/ci_guardian.py \
            --owners LambdaSection Lemniscate-world \
            --output lemniscate-world/ci-status.json \
            --readme lemniscate-world/README.md \
            --actions-log kuro-rules/KURO_ACTIONS_LOG.md
          cp lemniscate-world/ci-status.json kuro-rules/ci-status.json

      - name: Sécurité (vulnérabilités + auto-fixes, cycle complet)
        if: env.KURO_FULL == 'true'
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python kuro-rules/scripts/kuro_security.py \
            --owners LambdaSection Lemniscate-world

      # --- Vérité factuelle ---
      - name: Audit truth quotidien (git log + tests)
        if: env.KURO_FULL == 'true'
        run: |
          python kuro-rules/scripts/audit_truth_daily.py --dry-run --full --output kuro-rules/TRUTH_DAILY.md
          cat kuro-rules/TRUTH_DAILY.md | head -n 30

      - name: Kuro Radar (veille net, lundi uniquement)
        if: github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'ox-alpha:free' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python kuro-rules/scripts/kuro_radar.py \
              --append-truth kuro-rules/TRUTH_DAILY.md \
              --epingle kuro-rules/Epingle_Projets.md
          else
            echo "Pas lundi - radar saute"
          fi

      - name: Progression réaliste (% factuels)
        if: env.KURO_FULL == 'true'
        run: |
          python kuro-rules/scripts/compute_progress.py --apply
          git -C kuro-rules diff --stat || true

      - name: Skills vérifiés (détection auto + README)
        if: env.KURO_FULL == 'true'
        run: |
          python kuro-rules/scripts/kuro_skills.py \
            --docs /home/runner/Documents \
            --readme lemniscate-world/README.md \
            --output kuro-rules/skills.json

      # --- Publication ---
      - name: Portfolio + mondes
        if: env.KURO_FULL == 'true'
        run: |
          python kuro-rules/scripts/generate_portfolio.py \
            --epingle kuro-rules/Epingle_Projets.md \
            --output lemniscate-world/index.html

      - name: Blog factuel
        if: env.KURO_FULL == 'true'
        run: |
          python kuro-rules/scripts/generate_blog.py --apply

      - name: Gate design Impeccable (rapport séparé)
        if: env.KURO_FULL == 'true'
        run: |
          npx -y impeccable@latest detect --json lemniscate-world/index.html > lemniscate-world/design-report.json || true
          npx -y impeccable@latest detect lemniscate-world/index.html || true

      - name: Rapport hebdo Discord (lundi uniquement)
        if: env.KURO_FULL == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python kuro-rules/scripts/weekly_report.py \
              --ci-status lemniscate-world/ci-status.json \
              --epingle kuro-rules/Epingle_Projets.md \
              --repos-dir /home/runner/Documents \
              --actions-log kuro-rules/KURO_ACTIONS_LOG.md
            python kuro-rules/scripts/kuro_investor_digest.py \
              --epingle kuro-rules/Epingle_Projets.md \
              --ci-status lemniscate-world/ci-status.json \
              --actions-log kuro-rules/KURO_ACTIONS_LOG.md
          else
            echo "Pas lundi — rapport hebdo sauté"
          fi

      # --- Un seul commit par repo ---
      - name: Commit kuro-rules si changements
        run: |
          cd kuro-rules
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TRUTH_DAILY.md Epingle_Projets.md KURO_ACTIONS_LOG.md ci-status.json skills.json || true
          if ! git diff --cached --quiet; then
            git commit -m "kuro: audit quotidien $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin master || true
            git push
          else
            echo "Rien à committer"
          fi

      - name: Commit portfolio si changements
        run: |
          cd lemniscate-world
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sections/ blog/ ci-status.json design-report.json README.md || true
          if ! git diff --cached --quiet; then
            git commit -m "kuro: publication quotidienne $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Rien à publier"
          fi
